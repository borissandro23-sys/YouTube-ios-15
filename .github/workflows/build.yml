name: Build RetroTube IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate app icon asset catalog
        run: |
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          sips -s format png -z 1024 1024 youtube-icons-design_1080184-224.jpg --out Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          cat > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

      - name: Select Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app /Applications/Xcode.app 2>/dev/null | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS devices (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RetroTube.xcodeproj \
            -scheme RetroTube \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/RetroTube.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/RetroTube.app
          cd ipa
          zip -qry ../RetroTube-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetroTube-unsigned-IPA
          path: RetroTube-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
